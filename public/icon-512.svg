<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Subtle Tech Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#primary)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Core Shield & Brain Matrix -->
  <!-- Shield Emblem -->
  <path d="M256 100 L370 148 C370 260 256 360 256 380 C256 360 142 260 142 148 Z" fill="url(#primary)" opacity="0.15" filter="url(#glow)"/>
  <path d="M256 110 L356 154 C356 250 256 342 256 360 C256 342 156 250 156 154 Z" fill="none" stroke="url(#primary)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Brain & AI Nodes -->
  <!-- Center Star / Insight -->
  <circle cx="256" cy="220" r="18" fill="url(#gold)"/>
  
  <!-- Left Nodes -->
  <circle cx="206" cy="180" r="10" fill="#38bdf8"/>
  <circle cx="190" cy="240" r="10" fill="#38bdf8"/>
  <circle cx="220" cy="290" r="10" fill="#38bdf8"/>

  <!-- Right Nodes -->
  <circle cx="306" cy="180" r="10" fill="#38bdf8"/>
  <circle cx="322" cy="240" r="10" fill="#38bdf8"/>
  <circle cx="292" cy="290" r="10" fill="#38bdf8"/>

  <!-- Neural Connections -->
  <path d="M206 180 L256 220 M190 240 L256 220 M220 290 L256 220 M306 180 L256 220 M322 240 L256 220 M292 290 L256 220" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <path d="M206 180 L190 240 L220 290 M306 180 L322 240 L292 290" stroke="#60a5fa" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Sound Waves / Voice Indicator at Bottom -->
  <rect x="206" y="405" width="8" height="24" rx="4" fill="#38bdf8"/>
  <rect x="226" y="395" width="8" height="44" rx="4" fill="#60a5fa"/>
  <rect x="246" y="385" width="8" height="64" rx="4" fill="url(#gold)"/>
  <rect x="266" y="395" width="8" height="44" rx="4" fill="#60a5fa"/>
  <rect x="286" y="405" width="8" height="24" rx="4" fill="#38bdf8"/>
</svg>
